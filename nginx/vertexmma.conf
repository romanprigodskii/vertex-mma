# Example Nginx vhost for manual VPS deploy (no Coolify).
#
# Install:
#   sudo cp nginx/vertexmma.conf /etc/nginx/sites-available/vertexmma
#   sudo ln -s /etc/nginx/sites-available/vertexmma /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d vertexmma.com -d www.vertexmma.com
#   sudo systemctl reload nginx
#
# Certbot rewrites the listen/ssl_certificate blocks automatically.

server {
    server_name vertexmma.com www.vertexmma.com;

    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # Certbot fills these in:
    ssl_certificate     /etc/letsencrypt/live/vertexmma.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vertexmma.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Redirect www → apex
    if ($host = www.vertexmma.com) {
        return 301 https://vertexmma.com$request_uri;
    }

    # Generous upload size for avatar uploads via Supabase.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name vertexmma.com www.vertexmma.com;
    return 301 https://$host$request_uri;
}
