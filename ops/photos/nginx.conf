# Static origin for fighter photos. Nothing here is dynamic: the tree is
# <slug>/full.webp + <slug>/thumbnail.webp, written by the photo scraper and
# rsynced up. Next's image optimizer sits in front of these URLs, so the
# browser-facing cache headers mostly govern the optimizer's own disk cache.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    autoindex off;
    server_tokens off;

    # A missing photo is a normal outcome (the app falls back to an initials
    # tile), so answer it cheaply instead of rendering nginx's error page.
    error_page 404 = @empty;
    location @empty { return 404 "not found\n"; }

    location /fighter-photos/ {
        # A week, revalidated rather than immutable: the paths are stable
        # across a photo refresh, so a fighter who gets a new headshot must
        # not stay pinned to the old bytes in someone's browser.
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    location = /fighter-photos/healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / { return 404; }
}
